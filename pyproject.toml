[project]
name = "taskmgr"
version = "0.2.0"
description = "GPU performance-tuning task manager: local `task` CLI and `taskmgr-remote`"
readme = "taskmgr/README.md"
authors = [{ name = "Junyi Hou", email = "357197669+Junyi-Agent@users.noreply.github.com" }]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
task = "taskmgr.taskmgr:main"
taskmgr-remote = "taskmgr.remote:main"

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""          # flat layout: the package is ./taskmgr

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pre-commit>=4.6.2",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-include = ["bin/*"]  # extensionless Python entry points

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET", "S", "BLE", "PIE"]
ignore = [
    "S603", "S607",  # subprocess calls are intentional here
    "S606",          # os.exec*/spawn without a shell is intentional
    "S101",          # asserts are used for type narrowing
    "S103",          # 0o755 on scripts that must be executable
    "UP031",         # codebase uses %-formatting consistently
    "B009",          # getattr(obj, "name") is used to keep basedpyright strict mode happy
    "SIM105",        # try/except/pass is fine; contextlib.suppress is not clearer
    "SIM115",        # files handed to Popen / kept open on purpose
]

[tool.ruff.lint.per-file-ignores]
# The PreToolUse guards catch every exception on purpose: a crashing guard denies (fail closed).
".claude/hooks/{git,adr}_guard.py" = ["BLE001"]

[tool.ruff.lint.pycodestyle]
max-line-length = 150  # E501 threshold; ruff format still wraps at line-length = 100

[tool.basedpyright]
pythonVersion = "3.10"
pythonPlatform = "Linux"  # the remote side relies on /proc, fork, setsid
include = ["taskmgr"]
ignore = ["taskmgr/template/cutecache.py", "taskmgr/template/precompile.py"]  # need cutlass, quack, torch
typeCheckingMode = "all"

# Task packages run `python3 run.py` from their own directory, so `import taskmgr_task`
# resolves next to run.py. Tell the checker where those directories are.
[[tool.basedpyright.executionEnvironments]]
root = "taskmgr/template"
extraPaths = ["taskmgr/template"]

[[tool.basedpyright.executionEnvironments]]
root = "taskmgr/examples/succeed"
extraPaths = ["taskmgr/examples/succeed"]

[[tool.basedpyright.executionEnvironments]]
root = "taskmgr/examples/multi-gpu"
extraPaths = ["taskmgr/examples/multi-gpu"]
