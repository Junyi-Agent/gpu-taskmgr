[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "taskmgr"
version = "0.1.0"
description = "GPU performance-tuning task manager: local `task` CLI and `taskmgr-remote`"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
task = "taskmgr.taskmgr:main"
taskmgr-remote = "taskmgr.remote:main"

[tool.setuptools]
packages = ["taskmgr"]

[tool.setuptools.package-data]
taskmgr = ["template/*", "deploy/*"]
