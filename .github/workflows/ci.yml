# Checks every pull request and every push to main:
#   pre-commit  the hooks of .pre-commit-config.yaml on every file (uv lock, ruff check,
#               ruff format, basedpyright), with the tool versions of uv.lock
#   tests       the whole unittest suite on Linux with Python 3.10 (the oldest supported)
# Making these jobs required for merging is a branch protection setting of the repository
# (docs/adr/0003). release.yml calls this workflow before it publishes a release.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:  # release.yml runs the same checks before it builds a release

permissions:
  contents: read

# Called from release.yml, github.workflow is "Release": its checks never share a group with
# (and never cancel) the push CI of the same commit on main. A newer push to a pull request
# cancels the older run; runs on main are not cancelled, so every commit of main gets a result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # the jy-skills-copies hook compares the copies with .claude/jy-skills
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install the dev tools
        run: uv sync --locked
      - name: Run every hook on every file
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure

  tests:
    name: unit tests (Linux, Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.10"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Run the tests
        run: uv run --frozen python -m unittest discover -s taskmgr/tests -v
